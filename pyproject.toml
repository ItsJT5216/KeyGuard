[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keyguard"
version = "0.1.0"
description = "Local-first API credential circuit breaker"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "keyring>=25,<26",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
keyguard = "keyguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keyguard"]

[tool.hatch.build.targets.wheel.force-include]
"packaging/keyguard.service" = "keyguard/share/keyguard.service"
"packaging/keyguard.desktop" = "keyguard/share/keyguard.desktop"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["B008"]
