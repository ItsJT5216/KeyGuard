[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "keyguard"
version = "0.1.0"
description = "Local-first API credit protection daemon"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tanner Haywood" }]
dependencies = ["keyring>=24.3.1,<26"]

[project.scripts]
keyguard = "keyguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keyguard"]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S310"]


